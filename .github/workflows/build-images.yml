name: Build & Push Orchestrator Images

# Source of truth: apps/agent/docker/build-images.yml in the devshotcom/devshot
# monorepo. The monorepo's build-agent.yml workflow copies this file to
# .github/workflows/build-images.yml in the devshot-agent repo each time it
# pushes a new deploy artifact — so this workflow actually runs there.
#
# Triggered every time CI in the monorepo pushes new binaries + Dockerfiles
# to the devshot-agent repo.
#
# Active groups:
#   Group 1 (x86)            — dom0-amd64 followed by vmm-qemu-amd64 on
#                              the isolated devshot-agent builder group.
#
# Disabled groups (commented out below — uncomment to re-enable):
#   Group 2 (arm64)          — dom0-arm64 + vmm-qemu-arm64 + extract-boot-artifacts
#                              built on Docker Build Cloud
#   Group 3 (multi-arch domu) — domu + domu-desktop
#                              multi-arch manifests via Docker Build Cloud
#
# Tags produced by Group 1 (active):
#   anticipatercom/devshot:amd64           — Dom0 orchestrator, Linux x86_64 (KVM)
#   anticipatercom/devshot:amd64-kvm       — Direct QEMU backend, Linux x86_64
#
# Required repo secrets (configure in devshot-agent repo Settings → Secrets):
#   DOCKERHUB_USERNAME — Docker Hub user with push access to anticipatercom
#   DOCKERHUB_TOKEN    — Docker Hub access token
#
# Required Docker Build Cloud setup — only used by Groups 2 & 3 when enabled:
#   1. Subscribe to Docker Build Cloud on the anticipatercom org
#   2. Create a builder named "devshot": `docker buildx create --driver cloud anticipatercom/devshot`
#   3. If you rename the builder, update BUILDX_CLOUD_ENDPOINT below.
#
# IMPORTANT: Disable Docker Hub Automated Builds on anticipatercom/devshot,
# anticipatercom/devshot_domu, and anticipatercom/devshot_desktop — otherwise
# Docker Hub will race this workflow and clobber the manifests.

on:
  push:
    branches: [main]

concurrency:
  group: build-images-${{ github.ref }}
  # Do NOT cancel an in-flight image build when a newer push lands. Every
  # monorepo release tag pushes to this repo's `main`, so they all share one
  # concurrency group — cancel-in-progress let a rapid run of release tags
  # abort each other's image builds, leaving the registry stuck on a stale
  # image (the "agent/orchestrator never updates" bug). Queue instead.
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUILDX_CLOUD_ENDPOINT: anticipatercom/devshot

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Group 1 — x86 (active)
  # Runs on the isolated self-hosted devshot-agent builder group. The group is
  # restricted to this exact trusted main-branch workflow in GitHub settings.
  # Native amd64, no QEMU and no external Actions runner minutes.
  # ═══════════════════════════════════════════════════════════════════════

  # ── Dom0 orchestrator: Linux x86_64 ────────────────────────────────────
  build-dom0-amd64:
    runs-on:
      group: devshot-agent-builders
      labels: [self-hosted, Linux, X64, devshot-runner]
    timeout-minutes: 270
    env:
      CHECKOUT_DIR: source-${{ github.run_id }}-${{ github.run_attempt }}-dom0
      BUILDER_NAME: devshot-build-${{ github.run_id }}-${{ github.run_attempt }}-dom0
    steps:
      - name: Reclaim self-hosted runner workspace
        shell: bash
        run: |
          if [ -x /usr/local/sbin/reclaim-runner-workspace ]; then
            sudo -n /usr/local/sbin/reclaim-runner-workspace 2>/dev/null || true
          fi
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null \
              || sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ env.CHECKOUT_DIR }}
          persist-credentials: false

      - name: Initialize isolated self-hosted state
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh initialize dom0

      - name: Verify persistent builder prerequisites and workspace capacity
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh prepare 40

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      - name: Verify Docker data capacity
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh verify-docker-storage 40

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: ${{ env.BUILDER_NAME }}
          driver: docker-container
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build_dom0
        continue-on-error: true
        with:
          context: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}
          file: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}/docker/Dockerfile.dom0-x86
          builder: ${{ env.BUILDER_NAME }}
          platforms: linux/amd64
          provenance: false
          push: true
          # mode=min (was mode=max): only push the final image's layers
          # to the registry cache, not every intermediate stage. Saves
          # ~10 GB of buildkit disk pressure during the push phase of
          # the heavy multi-stage build — the registry still rehydrates
          # the most expensive layers (kernel, xen, android rootfs) on
          # the next run because they all land in the final image too.
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64
          # Cache export is best-effort; the image push above is the deploy artifact.
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64
            anticipatercom/devshot:amd64-${{ github.sha }}
      # Retry once on a transient BuildKit / Docker Hub flake (builder
      # graceful_stop, registry 400 on layer PUT). If this second attempt
      # also fails the job fails (no continue-on-error here).
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.build_dom0.outcome == 'failure'
        with:
          context: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}
          file: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}/docker/Dockerfile.dom0-x86
          builder: ${{ env.BUILDER_NAME }}
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64
            anticipatercom/devshot:amd64-${{ github.sha }}

      - name: Remove exact self-hosted builder state
        if: always()
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh cleanup

  # ── Direct QEMU backend: Linux x86_64 ──────────────────────────────────
  build-vmm-qemu-amd64:
    needs: build-dom0-amd64
    runs-on:
      group: devshot-agent-builders
      labels: [self-hosted, Linux, X64, devshot-runner]
    timeout-minutes: 330
    env:
      CHECKOUT_DIR: source-${{ github.run_id }}-${{ github.run_attempt }}-kvm
      BUILDER_NAME: devshot-build-${{ github.run_id }}-${{ github.run_attempt }}-kvm
    steps:
      - name: Reclaim self-hosted runner workspace
        shell: bash
        run: |
          if [ -x /usr/local/sbin/reclaim-runner-workspace ]; then
            sudo -n /usr/local/sbin/reclaim-runner-workspace 2>/dev/null || true
          fi
          if [ -n "${GITHUB_WORKSPACE:-}" ] && [ -d "$GITHUB_WORKSPACE" ]; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true
            find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null \
              || sudo -n find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} + 2>/dev/null
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: ${{ env.CHECKOUT_DIR }}
          persist-credentials: false

      - name: Initialize isolated self-hosted state
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh initialize kvm

      - name: Verify persistent builder prerequisites and workspace capacity
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh prepare 40

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          logout: false

      - name: Verify Docker data capacity
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh verify-docker-storage 40

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          name: ${{ env.BUILDER_NAME }}
          driver: docker-container
          cleanup: false
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Bake public LAMP Studio templates
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: |
          set -euo pipefail

          rm -rf .build/lamp templates/lamp
          mkdir -p .build/lamp templates/lamp

          source roles/dom0/files/bounded-docker-run.sh
          trap bounded_docker_cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          bounded_docker_extract_file \
            anticipatercom/devshot:amd64-${{ github.sha }} \
            /xen/devshot-guest-base.qcow2 \
            .build/lamp/devshot-guest-base.qcow2

          MATRIX_FILTER='^(wp-6\.9|sw-6\.7)$' \
            bash roles/dom0/files/build-lamp-matrix.sh .build/lamp recipes/lamp

          cp .build/lamp/devshot-guest-lamp-shared.qcow2 templates/lamp/
          cp .build/lamp/devshot-guest-lamp-shared.json templates/lamp/
          cp .build/lamp/devshot-guest-lamp-wp-6.9.qcow2 templates/lamp/
          cp .build/lamp/devshot-guest-lamp-wp-6.9.json templates/lamp/
          cp .build/lamp/devshot-guest-lamp-sw-6.7.qcow2 templates/lamp/
          cp .build/lamp/devshot-guest-lamp-sw-6.7.json templates/lamp/
          cp .build/lamp/lamp-matrix.lock.json templates/lamp/

          echo "Public LAMP Studio templates:"
          ls -lh templates/lamp/

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build_vmm
        continue-on-error: true
        with:
          context: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}
          file: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}/docker/Dockerfile.vmm-qemu-x86
          builder: ${{ env.BUILDER_NAME }}
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=anticipatercom/devshot:amd64-${{ github.sha }}
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64-kvm
            anticipatercom/devshot:amd64-kvm-${{ github.sha }}
      # Retry once on a transient BuildKit / Docker Hub flake. The bake step
      # above already produced its artifacts, so only the push is re-attempted.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        if: steps.build_vmm.outcome == 'failure'
        with:
          context: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}
          file: ${{ github.workspace }}/${{ env.CHECKOUT_DIR }}/docker/Dockerfile.vmm-qemu-x86
          builder: ${{ env.BUILDER_NAME }}
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=anticipatercom/devshot:amd64-${{ github.sha }}
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64-kvm
            anticipatercom/devshot:amd64-kvm-${{ github.sha }}

      - name: Remove exact self-hosted builder state
        if: always()
        working-directory: ${{ env.CHECKOUT_DIR }}
        run: bash docker/self-hosted-builder.sh cleanup anticipatercom/devshot:amd64-${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════
