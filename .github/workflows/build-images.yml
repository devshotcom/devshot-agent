name: Build & Push Orchestrator Images

# Source of truth: apps/agent/docker/build-images.yml in the devshotcom/devshot
# monorepo. The monorepo's build-agent.yml workflow copies this file to
# .github/workflows/build-images.yml in the devshot-agent repo each time it
# pushes a new deploy artifact — so this workflow actually runs there.
#
# Triggered every time CI in the monorepo pushes new binaries + Dockerfiles
# to the devshot-agent repo.
#
# Active groups:
#   Group 1 (x86)            — dom0-amd64 + vmm-qemu-amd64
#                              run on the self-hosted X64 runner (Hetzner)
#
# Disabled groups (commented out below — uncomment to re-enable):
#   Group 2 (arm64)          — dom0-arm64 + vmm-qemu-arm64 + extract-boot-artifacts
#                              built on Docker Build Cloud
#   Group 3 (multi-arch domu) — domu + domu-desktop
#                              multi-arch manifests via Docker Build Cloud
#
# Tags produced by Group 1 (active):
#   anticipatercom/devshot:amd64           — Dom0 orchestrator, Linux x86_64 (KVM)
#   anticipatercom/devshot:amd64-kvm       — Direct QEMU backend, Linux x86_64
#
# Required repo secrets (configure in devshot-agent repo Settings → Secrets):
#   DOCKERHUB_USERNAME — Docker Hub user with push access to anticipatercom
#   DOCKERHUB_TOKEN    — Docker Hub access token
#   BOOT_ARTIFACTS_PUSH_TOKEN — only needed for Group 2 (arm64); commit boot/
#                               artifacts back to devshot-agent main.
#
# Required Docker Build Cloud setup — only used by Groups 2 & 3 when enabled:
#   1. Subscribe to Docker Build Cloud on the anticipatercom org
#   2. Create a builder named "devshot": `docker buildx create --driver cloud anticipatercom/devshot`
#   3. If you rename the builder, update BUILDX_CLOUD_ENDPOINT below.
#
# IMPORTANT: Disable Docker Hub Automated Builds on anticipatercom/devshot,
# anticipatercom/devshot_domu, and anticipatercom/devshot_desktop — otherwise
# Docker Hub will race this workflow and clobber the manifests.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILDX_CLOUD_ENDPOINT: anticipatercom/devshot

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Group 1 — x86 (active)
  # Runs on self-hosted Hetzner runner (label: [self-hosted, X64]).
  # Native amd64, no QEMU, no Build Cloud minutes.
  # ═══════════════════════════════════════════════════════════════════════

  # ── Dom0 orchestrator: Linux x86_64 ────────────────────────────────────
  build-dom0-amd64:
    runs-on: [self-hosted, X64]
    steps:
      - uses: actions/checkout@v4

      # The self-hosted Hetzner runner has finite disk. Dom0-x86 is a heavy
      # multi-stage build — Xen + kernel from source, a 5 GB desktop rootfs,
      # a 6 GB android rootfs that bakes the 830 MB Android-x86 ISO, plus a
      # 2 GB browser kiosk rootfs — so a few back-to-back builds otherwise
      # fill `/var/lib/docker` and crash the runner with
      # `System.IO.IOException: No space left on device` (the exact crash
      # that broke commit 62182272 → no `:amd64` push → prod still misses
      # the browser template). Prune everything not currently referenced
      # before every build; the registry-backed buildcache below is
      # unaffected and rehydrates the layers we actually want to keep.
      - name: Free runner disk before build
        run: |
          echo "── disk before prune ─────────────────────────────────"
          df -h /
          docker system prune -af --volumes || true
          docker builder prune -af || true
          # Trim the runner's own diagnostic logs (the file that filled
          # the disk during the 62182272 crash lived under _diag/).
          sudo find /opt/actions-runner-devshot/_diag -type f -mtime +1 -delete 2>/dev/null || true
          echo "── disk after prune ──────────────────────────────────"
          df -h /

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dom0-x86
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64,mode=max
          tags: |
            anticipatercom/devshot:amd64
            anticipatercom/devshot:amd64-${{ github.sha }}

  # ── Direct QEMU backend: Linux x86_64 ──────────────────────────────────
  build-vmm-qemu-amd64:
    needs: build-dom0-amd64
    runs-on: [self-hosted, X64]
    steps:
      - uses: actions/checkout@v4

      # Same disk hygiene as build-dom0-amd64: the dom0 build above leaves
      # ~10 GB of intermediate layers behind, and vmm-qemu then COPYs from
      # `BASE_IMAGE=anticipatercom/devshot:amd64-<sha>` (effectively another
      # full pull). Without a prune the runner runs out mid-build.
      - name: Free runner disk before build
        run: |
          echo "── disk before prune ─────────────────────────────────"
          df -h /
          docker system prune -af --volumes || true
          docker builder prune -af || true
          sudo find /opt/actions-runner-devshot/_diag -type f -mtime +1 -delete 2>/dev/null || true
          echo "── disk after prune ──────────────────────────────────"
          df -h /

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.vmm-qemu-x86
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=anticipatercom/devshot:amd64-${{ github.sha }}
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64,mode=max
          tags: |
            anticipatercom/devshot:amd64-kvm
            anticipatercom/devshot:amd64-kvm-${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════
  # Group 2 — arm64 (disabled)
  # Re-enable by removing the leading `# ` from each line below.
  # Builds on Docker Build Cloud (native arm64 builder).
