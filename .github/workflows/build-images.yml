  #     - uses: docker/setup-buildx-action@v3
  #       with:
  #         version: "lab:latest"
  #         driver: cloud
  #         endpoint: ${{ env.BUILDX_CLOUD_ENDPOINT }}
  #         install: true
  #
  #     - uses: docker/build-push-action@v6
  #       with:
  #         context: .
  #         file: docker/Dockerfile.dom0-arm
  #         platforms: linux/arm64
  #         provenance: false
  #         push: true
  #         cache-from: type=registry,ref=anticipatercom/devshot:buildcache-dom0-arm64
  #         cache-to: type=registry,ref=anticipatercom/devshot:buildcache-dom0-arm64,mode=max
  #         tags: |
  #           anticipatercom/devshot:arm64
  #           anticipatercom/devshot:arm64-${{ github.sha }}
  #           anticipatercom/devshot:arm64-mac
  #           anticipatercom/devshot:arm64-mac-${{ github.sha }}
  #
  # # ── Direct QEMU backend: Linux ARM64 ───────────────────────────────────
  # build-vmm-qemu-arm64:
  #   needs: build-dom0-arm64
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #
  #     - uses: docker/login-action@v3
  #       with:
  #         username: ${{ secrets.DOCKERHUB_USERNAME }}
  #         password: ${{ secrets.DOCKERHUB_TOKEN }}
  #
  #     - uses: docker/setup-buildx-action@v3
  #       with:
  #         version: "lab:latest"
  #         driver: cloud
  #         endpoint: ${{ env.BUILDX_CLOUD_ENDPOINT }}
  #         install: true
