name: Build & Push Orchestrator Images

# Source of truth: apps/agent/docker/build-images.yml in the devshotcom/devshot
# monorepo. The monorepo's build-agent.yml workflow copies this file to
# .github/workflows/build-images.yml in the devshot-agent repo each time it
# pushes a new deploy artifact — so this workflow actually runs there.
#
# Triggered every time CI in the monorepo pushes new binaries + Dockerfiles
# to the devshot-agent repo.
#
# Active groups:
#   Group 1 (x86)            — dom0-amd64 + vmm-qemu-amd64
#                              run on the self-hosted runner on
#                              sharp-ada (label: [self-hosted, Linux,
#                              X64]). Moved off GH-hosted ubuntu-latest
#                              after the devshotcom org's Actions
#                              spending limit started rejecting jobs.
#
# Disabled groups (commented out below — uncomment to re-enable):
#   Group 2 (arm64)          — dom0-arm64 + vmm-qemu-arm64 + extract-boot-artifacts
#                              built on Docker Build Cloud
#   Group 3 (multi-arch domu) — domu + domu-desktop
#                              multi-arch manifests via Docker Build Cloud
#
# Tags produced by Group 1 (active):
#   anticipatercom/devshot:amd64           — Dom0 orchestrator, Linux x86_64 (KVM)
#   anticipatercom/devshot:amd64-kvm       — Direct QEMU backend, Linux x86_64
#
# Required repo secrets (configure in devshot-agent repo Settings → Secrets):
#   DOCKERHUB_USERNAME — Docker Hub user with push access to anticipatercom
#   DOCKERHUB_TOKEN    — Docker Hub access token
#   BOOT_ARTIFACTS_PUSH_TOKEN — only needed for Group 2 (arm64); commit boot/
#                               artifacts back to devshot-agent main.
#
# Required Docker Build Cloud setup — only used by Groups 2 & 3 when enabled:
#   1. Subscribe to Docker Build Cloud on the anticipatercom org
#   2. Create a builder named "devshot": `docker buildx create --driver cloud anticipatercom/devshot`
#   3. If you rename the builder, update BUILDX_CLOUD_ENDPOINT below.
#
# IMPORTANT: Disable Docker Hub Automated Builds on anticipatercom/devshot,
# anticipatercom/devshot_domu, and anticipatercom/devshot_desktop — otherwise
# Docker Hub will race this workflow and clobber the manifests.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  # Do NOT cancel an in-flight image build when a newer push lands. Every
  # monorepo release tag pushes to this repo's `main`, so they all share one
  # concurrency group — cancel-in-progress let a rapid run of release tags
  # abort each other's image builds, leaving the registry stuck on a stale
  # image (the "agent/orchestrator never updates" bug). Queue instead.
  cancel-in-progress: false

permissions:
  contents: write

env:
  BUILDX_CLOUD_ENDPOINT: anticipatercom/devshot

jobs:
  # ═══════════════════════════════════════════════════════════════════════
  # Group 1 — x86 (active)
  # Runs on GH-hosted ubuntu-latest with easimon/maximize-build-space.
  # Native amd64, no QEMU, no Build Cloud minutes — GH minutes only.
  # ═══════════════════════════════════════════════════════════════════════

  # ── Dom0 orchestrator: Linux x86_64 ────────────────────────────────────
  # Moved off the self-hosted Hetzner runner to GH-hosted ubuntu-latest:
  # Hetzner's box tops out at ~20 GB free (75 GB total, 53 GB of system
  # + runner state we can't safely prune — see run 25957475459 where the
  # `Free runner disk before build` step reclaimed only 2.36 GB and the
  # build still OOM'd on disk). The dom0-x86 multi-stage build — Xen +
  # kernel from source, a 5 GB desktop rootfs, a 6 GB android rootfs
  # that bakes the 830 MB Android-x86 ISO, plus a 2 GB browser kiosk
  # rootfs — peaks well above that, so we ended up shipping prod images
  # that predate the browser template (1fb9533) and the KVM-in-DomU
  # kernel (057f119). GH-hosted ubuntu-latest plus `maximize-build-space`
  # (which evicts the preinstalled toolchains we don't need — dotnet,
  # android-sdk, ghc, haskell, codeql) gets us to ~70 GB free. Minutes
  # are billable on private repos but the cost (<$0.10/run) beats the
  # constant infra babysitting.
  build-dom0-amd64:
    # Self-hosted runner on sharp-ada (the prod orchestrator box, 108 GB
    # disk, plenty for the multi-stage dom0 build). We moved off
    # GH-hosted ubuntu-latest after the devshotcom org's Actions
    # spending limit started rejecting jobs ("Job is waiting for a
    # hosted runner" → instant fail with no steps, see run 25978742958).
    # Sharp-ada has the disk headroom, the runner binary, and zero
    # GH-Actions minutes cost.
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Inline cleanup instead of easimon/maximize-build-space. Three
      # earlier attempts failed:
      #   - Default mount path → LV at /mnt/build, Docker still on root.
      #   - build-mount-path=/var/lib/docker → daemon broke mid-build
      #     ("ERROR: open /var/lib/docker/tmp/...: no such file or
      #     directory" — the action mounted an empty fs over the dir
      #     while dockerd held open handles to the old files).
      #   - root-reserve=6144 → action still squeezed root to 100 MiB.
      #
      # GH-hosted ubuntu-24.04 ships with `/dev/root 72 G, 17 G free` and
      # ~35 GiB of preinstalled toolchains we don't use (dotnet, android-
      # sdk, ghc, haskell, codeql, hostedtoolcache). Deleting those
      # in-place — no LV, no mount juggle — gets us to ~50 GiB free root
      # without touching the docker daemon. /var/lib/docker stays on root.
      - name: Free runner disk
        run: |
          echo "── disk before cleanup ──────────────────────────────"
          df -h /
          docker system df || true
          # On GH-hosted ubuntu-latest these dirs hold ~35 GiB of
          # toolchains we don't use; rm reclaims them. On self-hosted
          # (sharp-ada) they don't exist → no-op. Safe either way.
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python \
                   /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
                   /usr/share/swift /usr/local/share/powershell \
                   /usr/local/share/chromium /usr/local/share/boost; do
            [ -d "$d" ] && sudo rm -rf "$d" 2>/dev/null || true
          done
          # Guard: only prune on a clean GH-hosted runner. Sharp-ada
          # has /var/lib/devshot from the prod orchestrator container —
          # pruning its images would destroy the running devshot:amd64-kvm.
          # BuildKit cache is independent of running prod containers, so
          # prune it on every runner before this disk-heavy image build.
          sudo docker builder prune --all --force 2>/dev/null || true
          if [ ! -d /var/lib/devshot ]; then
            sudo docker image prune --all --force 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
          else
            echo "self-hosted runner — skipping destructive prune"
          fi
          echo "── disk after cleanup ───────────────────────────────"
          df -h /
          docker system df || true

      - uses: actions/checkout@v4

      - name: Report disk space
        run: |
          echo "── disk available for build ──────────────────────────"
          df -h /

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - uses: docker/build-push-action@v6
        id: build_dom0
        continue-on-error: true
        with:
          context: .
          file: docker/Dockerfile.dom0-x86
          platforms: linux/amd64
          provenance: false
          push: true
          # mode=min (was mode=max): only push the final image's layers
          # to the registry cache, not every intermediate stage. Saves
          # ~10 GB of buildkit disk pressure during the push phase of
          # the heavy multi-stage build — the registry still rehydrates
          # the most expensive layers (kernel, xen, android rootfs) on
          # the next run because they all land in the final image too.
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64
          # Cache export is best-effort; the image push above is the deploy artifact.
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64
            anticipatercom/devshot:amd64-${{ github.sha }}
      # Retry once on a transient Docker Build Cloud / Hub flake (builder
      # graceful_stop, registry 400 on layer PUT). If this second attempt
      # also fails the job fails (no continue-on-error here).
      - uses: docker/build-push-action@v6
        if: steps.build_dom0.outcome == 'failure'
        with:
          context: .
          file: docker/Dockerfile.dom0-x86
          platforms: linux/amd64
          provenance: false
          push: true
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-dom0-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64
            anticipatercom/devshot:amd64-${{ github.sha }}

  # ── Direct QEMU backend: Linux x86_64 ──────────────────────────────────
  build-vmm-qemu-amd64:
    # Same self-hosted runner as build-dom0-amd64.
    runs-on: [self-hosted, Linux, X64]
    steps:
      # Same inline cleanup as build-dom0-amd64 — see comment there.
      - name: Free runner disk
        run: |
          echo "── disk before cleanup ──────────────────────────────"
          df -h /
          docker system df || true
          # On GH-hosted ubuntu-latest these dirs hold ~35 GiB of
          # toolchains we don't use; rm reclaims them. On self-hosted
          # (sharp-ada) they don't exist → no-op. Safe either way.
          for d in /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                   /opt/hostedtoolcache/CodeQL /opt/hostedtoolcache/Python \
                   /opt/hostedtoolcache/PyPy /opt/hostedtoolcache/Java_Temurin-Hotspot_jdk \
                   /usr/share/swift /usr/local/share/powershell \
                   /usr/local/share/chromium /usr/local/share/boost; do
            [ -d "$d" ] && sudo rm -rf "$d" 2>/dev/null || true
          done
          # Guard: only prune on a clean GH-hosted runner. Sharp-ada
          # has /var/lib/devshot from the prod orchestrator container —
          # pruning its images would destroy the running devshot:amd64-kvm.
          # BuildKit cache is independent of running prod containers, so
          # prune it on every runner before this disk-heavy image build.
          sudo docker builder prune --all --force 2>/dev/null || true
          if [ ! -d /var/lib/devshot ]; then
            sudo docker image prune --all --force 2>/dev/null || true
            sudo apt-get clean 2>/dev/null || true
          else
            echo "self-hosted runner — skipping destructive prune"
          fi
          echo "── disk after cleanup ───────────────────────────────"
          df -h /
          docker system df || true

      - uses: actions/checkout@v4

      - name: Report disk space
        run: |
          echo "── disk available for build ──────────────────────────"
          df -h /

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 1

      - name: Bake WordPress public demo template
        run: |
          set -euo pipefail

          mkdir -p .build/lamp templates/lamp

          docker pull anticipatercom/devshot:amd64
          cid="$(docker create anticipatercom/devshot:amd64)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker cp "$cid:/xen/devshot-guest-base.qcow2" .build/lamp/devshot-guest-base.qcow2

          MATRIX_FILTER='^wp-6\.9$' \
            bash roles/dom0/files/build-lamp-matrix.sh .build/lamp recipes/lamp

          cp .build/lamp/devshot-guest-lamp-shared.qcow2 templates/lamp/
          cp .build/lamp/devshot-guest-lamp-shared.json templates/lamp/
          cp .build/lamp/devshot-guest-lamp-wp-6.9.qcow2 templates/lamp/
          cp .build/lamp/devshot-guest-lamp-wp-6.9.json templates/lamp/
          cp .build/lamp/lamp-matrix.lock.json templates/lamp/

          echo "WordPress public demo templates:"
          ls -lh templates/lamp/

          # ── Publish boot artifacts for the LAMP rebake ──────────────────
          # lamp-rebake.yml (monorepo) pulls boot/devshot-guest-base.qcow2 from
          # THIS repo as the base it overlays each variant on. The base is
          # already extracted above (.build/lamp/); also pull the domU kernel,
          # then commit both to boot/. Pushed with the workflow's GITHUB_TOKEN
          # (contents:write) — which does NOT re-trigger workflows, so no rebuild
          # loop. This replaces the old arm64-only extract-boot-artifacts job
          # (disabled below): without it boot/ is never published and the nightly
          # rebake's base-pull 404s, so lamp-sw-6.7 et al. never get baked.
          mkdir -p boot
          cp .build/lamp/devshot-guest-base.qcow2 boot/devshot-guest-base.qcow2
          docker cp "$cid:/xen/boot/Image-domu" boot/Image-domu 2>/dev/null \
            || docker cp "$cid:/xen/Image" boot/Image-domu 2>/dev/null \
            || echo "WARN: Image-domu not found in image (boot/ will lack the kernel)"
          ls -lh boot/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add boot/
          if git diff --cached --quiet; then
            echo "boot artifacts unchanged — nothing to commit"
          else
            git commit -m "Update boot artifacts (guest base + Image-domu) from ${GITHUB_SHA::8}"
            git push origin HEAD:main || echo "WARN: boot/ push failed (will retry next build)"
          fi

      - uses: docker/build-push-action@v6
        id: build_vmm
        continue-on-error: true
        with:
          context: .
          file: docker/Dockerfile.vmm-qemu-x86
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=anticipatercom/devshot:amd64
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64-kvm
            anticipatercom/devshot:amd64-kvm-${{ github.sha }}
      # Retry once on a transient Docker Build Cloud / Hub flake. The bake step
      # above already produced its artifacts, so only the push is re-attempted.
      - uses: docker/build-push-action@v6
        if: steps.build_vmm.outcome == 'failure'
        with:
          context: .
          file: docker/Dockerfile.vmm-qemu-x86
          platforms: linux/amd64
          provenance: false
          push: true
          build-args: |
            BASE_IMAGE=anticipatercom/devshot:amd64
          cache-from: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64
          cache-to: type=registry,ref=anticipatercom/devshot:buildcache-vmm-qemu-amd64,mode=min,ignore-error=true
          tags: |
            anticipatercom/devshot:amd64-kvm
            anticipatercom/devshot:amd64-kvm-${{ github.sha }}

  # ═══════════════════════════════════════════════════════════════════════
  # Group 2 — arm64 (disabled)
  # Re-enable by removing the leading `# ` from each line below.
  # Builds on Docker Build Cloud (native arm64 builder).
  # ═══════════════════════════════════════════════════════════════════════
