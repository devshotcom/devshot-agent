name: "[ARM64] Build & Push Orchestrator Images"
run-name: "[ARM64] ${{ github.event.head_commit.message }}"

on:
  push:
    branches: [main]

permissions:
  actions: read
  contents: read

jobs:
  release-mode:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read exact mirror release mode
        id: mode
        shell: bash
        run: bash docker/read-release-mode.sh >> "$GITHUB_OUTPUT"

  build-arm64:
    needs: release-mode
    if: ${{ needs.release-mode.outputs.mode == 'full' }}
    uses: ./.github/workflows/build-images.yml
    with:
      image_family: arm64
      release_mode: full
    secrets: inherit
